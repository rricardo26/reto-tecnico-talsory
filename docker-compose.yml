services:
  db:
    image: postgres:16-alpine
    container_name: interseguro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-interseguro_endosos}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interseguro_endosos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-endosos:
    build:
      context: ./endorsement-translator-api
      dockerfile: Dockerfile
    container_name: api-endosos
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_ENDOSOS_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_DATABASE: ${POSTGRES_DB:-interseguro_endosos}
      DB_SYNCHRONIZE: "true"
      JWT_SECRET: ${JWT_SECRET:-interseguro-super-secret-key}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}

  api-rutas:
    build:
      context: ./optimal-routes-api
      dockerfile: Dockerfile
    container_name: api-rutas
    restart: unless-stopped
    ports:
      - "${API_RUTAS_PORT:-8081}:8080"
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-interseguro-super-secret-key}

  web:
    build:
      context: ./interseguro-evolution-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: interseguro-web
    restart: unless-stopped
    depends_on:
      - api-endosos
      - api-rutas
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
